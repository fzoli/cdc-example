name: mongo

services:
  mongo1:
    image: mongo:7
    container_name: mongo1
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - 127.0.0.1:27017:27017
    volumes:
      - mongo1_data:/data/db
    networks:
      - mongo-cluster

  # opcionális helper container a replSet inicializálásra
  mongosetup:
    image: mongo:7
    container_name: mongosetup
    depends_on:
      - mongo1
    entrypoint: >
      bash -c "
        sleep 5 &&
        mongosh --host mongo1:27017 --eval '
          rs.initiate({
            _id: \"rs0\",
            members: [
              { _id: 0, host: \"127.0.0.1:27017\" }
            ]
          });
          rs.status();
        '
      "
    networks:
      - mongo-cluster

  mongo-express:
    image: mongo-express
    ports:
      - 127.0.0.1:8081:8081
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo1
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
    depends_on:
      - mongo1
    networks:
      - mongo-cluster

volumes:
  mongo1_data:

networks:
  mongo-cluster: {}
